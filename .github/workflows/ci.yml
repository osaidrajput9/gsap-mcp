# Build + test only.
#
# This workflow deliberately performs NO publishing. The upstream project used
# semantic-release here to push `@vinhnguyen/gsap-mcp` to npm on every commit to
# main, using the NPM_TOKEN / NODE_AUTH_TOKEN secrets and npm provenance
# (id-token: write). That is wrong for a fork: it would publish a breaking major
# of somebody else's package name, and it force-pushes release commits back to
# main. The release job was removed.
#
# This fork is published as @osaidrajput9/gsap-mcp, by hand, from a machine
# logged in to npm. No workflow holds a registry credential, and none ever
# should.
#
# Do not add a registry, a publish step, or any secret to this file.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Without a browser the browser suite skips itself, and the bugs it
      # exists to catch (GSAP rejecting a snippet, a ScrollTrigger whose
      # trigger silently resolves to null) would reach main unnoticed.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
